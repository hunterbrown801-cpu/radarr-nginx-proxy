# Radarr Nginx Reverse Proxy Configuration
# This configuration proxies requests to a local Radarr instance
# Uncomment SSL section and update certificate paths for HTTPS

upstream radarr_backend {
    server localhost:7878;
    keepalive 32;
}

# HTTP to HTTPS redirect (uncomment when SSL is configured)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name yourdomain.com www.yourdomain.com;
#     return 301 https://$server_name$request_uri;
# }

# Main server block
server {
    # HTTP listener (comment out when using HTTPS)
    listen 80;
    listen [::]:80;
    
    # HTTPS listener (uncomment and configure for production)
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;

    server_name yourdomain.com www.yourdomain.com;

    # Logging
    access_log /var/log/nginx/radarr_access.log;
    error_log /var/log/nginx/radarr_error.log;

    # Root location - redirect to /radarr
    location / {
        return 301 $scheme://$server_name/radarr;
    }

    # Radarr application location
    location /radarr {
        proxy_pass http://radarr_backend;
        proxy_http_version 1.1;
        
        # Proxy headers - critical for reverse proxy operation
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Connection settings
        proxy_set_header Connection "";
        proxy_redirect off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket support for Radarr (if needed)
    location /radarr/signalr {
        proxy_pass http://radarr_backend/signalr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ ~$ {
        deny all;
    }
}
