# Nginx reverse proxy for the local Jellyfin home-server stack.
#
# This is a single server block (not one file per app) so all locations
# share one listen/server_name pair without nginx silently ignoring
# duplicate server blocks. Fronts Prowlarr, Sonarr, Radarr, qBittorrent
# and Jellyfin behind one port. Jellyseerr is intentionally left off this
# proxy - its web app does not reliably support running under a subpath,
# so reach it directly at http://<lan-ip>:5055 instead.
#
# Usage: see examples/docker-compose.jellyfin-stack.yml (--profile proxy)
# or docs/JELLYFIN_HOME_SERVER.md for bare-metal Nginx instructions.

upstream jellyfin_backend {
    server jellyfin:8096;
    keepalive 32;
}

upstream prowlarr_backend {
    server prowlarr:9696;
    keepalive 32;
}

upstream sonarr_backend {
    server sonarr:8989;
    keepalive 32;
}

upstream radarr_backend {
    server radarr:7878;
    keepalive 32;
}

upstream qbittorrent_backend {
    server qbittorrent:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/jellyfin-stack_access.log;
    error_log /var/log/nginx/jellyfin-stack_error.log;

    # Simple landing page with links to every service.
    location = / {
        default_type text/html;
        return 200 '<html><body style="font-family:sans-serif">
            <h1>Home Media Server</h1>
            <ul>
                <li><a href="/jellyfin">Jellyfin</a></li>
                <li><a href="/prowlarr">Prowlarr</a></li>
                <li><a href="/sonarr">Sonarr</a></li>
                <li><a href="/radarr">Radarr</a></li>
                <li><a href="/qbittorrent">qBittorrent</a></li>
                <li>Jellyseerr: use this server&#39;s LAN IP on port 5055 (see docs)</li>
            </ul>
            </body></html>';
    }

    # --- Jellyfin ---------------------------------------------------
    # Requires: Jellyfin Dashboard -> Networking -> Base URL = /jellyfin
    location /jellyfin/ {
        proxy_pass http://jellyfin_backend/jellyfin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # --- Prowlarr -----------------------------------------------------
    # Requires: Prowlarr Settings -> General -> URL Base = /prowlarr
    location /prowlarr {
        proxy_pass http://prowlarr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    # --- Sonarr ---------------------------------------------------------
    # Requires: Sonarr Settings -> General -> URL Base = /sonarr
    location /sonarr {
        proxy_pass http://sonarr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    location /sonarr/signalr {
        proxy_pass http://sonarr_backend/signalr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Radarr ---------------------------------------------------------
    # Requires: Radarr Settings -> General -> URL Base = /radarr
    location /radarr {
        proxy_pass http://radarr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    location /radarr/signalr {
        proxy_pass http://radarr_backend/signalr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- qBittorrent ------------------------------------------------
    # Requires: qBittorrent WebUI -> Advanced -> "Server domains" allows
    # this host, or leave the default "*" during local/home use.
    location /qbittorrent/ {
        proxy_pass http://qbittorrent_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ ~$ {
        deny all;
    }
}
