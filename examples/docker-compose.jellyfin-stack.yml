# Full local home media server stack:
#   Jellyfin (media server) + Prowlarr (indexer manager) + Sonarr (TV) +
#   Radarr (movies) + Jellyseerr (requests) + qBittorrent (downloads)
#
# See docs/JELLYFIN_HOME_SERVER.md for the full setup walkthrough.
#
# Quick start:
#   1. Copy this file (and nginx/jellyfin-stack.conf, if you want the proxy)
#      into the directory on your desktop where you want the server to live.
#   2. Run `id` and update PUID/PGID/TZ below to match your user.
#   3. Create the data directories:
#        mkdir -p jellyfin/config jellyfin/cache prowlarr/config \
#          sonarr/config radarr/config jellyseerr/config qbittorrent/config \
#          media/movies media/tv downloads
#   4. Start the core stack:
#        docker compose -f docker-compose.jellyfin-stack.yml up -d
#   5. (Optional) Also start the Nginx single-entry-point proxy:
#        docker compose -f docker-compose.jellyfin-stack.yml --profile proxy up -d
#   6. (Optional) Also start SABnzbd if you use Usenet indexers:
#        docker compose -f docker-compose.jellyfin-stack.yml --profile usenet up -d

x-common-env: &common-env
  PUID: 1000
  PGID: 1000
  TZ: America/New_York

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *common-env
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ./media/movies:/data/movies:ro
      - ./media/tv:/data/tv:ro
    ports:
      - "8096:8096"     # Web UI / API (HTTP) - reach directly at http://<lan-ip>:8096
      - "7359:7359/udp" # LAN client auto-discovery
    restart: unless-stopped
    networks:
      - media-network

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *common-env
    volumes:
      - ./prowlarr/config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks:
      - media-network

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *common-env
    volumes:
      - ./sonarr/config:/config
      - ./media/tv:/tv
      - ./downloads:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped
    networks:
      - media-network
    depends_on:
      - prowlarr

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *common-env
    volumes:
      - ./radarr/config:/config
      - ./media/movies:/movies
      - ./downloads:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped
    networks:
      - media-network
    depends_on:
      - prowlarr

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      TZ: America/New_York
      LOG_LEVEL: info
    volumes:
      - ./jellyseerr/config:/app/config
    ports:
      - "5055:5055"     # Reach directly at http://<lan-ip>:5055
    restart: unless-stopped
    networks:
      - media-network
    depends_on:
      - jellyfin
      - sonarr
      - radarr

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    volumes:
      - ./qbittorrent/config:/config
      - ./downloads:/downloads
    ports:
      - "8080:8080"       # Web UI
      - "6881:6881"       # Torrent traffic (TCP)
      - "6881:6881/udp"   # Torrent traffic (UDP)
    restart: unless-stopped
    networks:
      - media-network

  # Optional: Usenet download client. Only needed if you add Usenet
  # indexers in Prowlarr in addition to (or instead of) torrent trackers.
  sabnzbd:
    image: linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      <<: *common-env
    volumes:
      - ./sabnzbd/config:/config
      - ./downloads:/downloads
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - media-network
    profiles:
      - usenet

  # Optional: single-entry-point reverse proxy for the *arr web UIs.
  # Jellyfin and Jellyseerr are simplest reached directly on their own
  # ports on the LAN (see docs/JELLYFIN_HOME_SERVER.md), so this proxy
  # fronts Prowlarr/Sonarr/Radarr/qBittorrent behind one port-80 host.
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    volumes:
      - ./nginx/jellyfin-stack.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - prowlarr
      - sonarr
      - radarr
      - qbittorrent
    restart: unless-stopped
    networks:
      - media-network
    profiles:
      - proxy

networks:
  media-network:
    driver: bridge
